<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <title>ระบบจัดตารางเรียน</title>
    
    <style>
        body {
            background-color: #ffffff;
            color: #121212;
            font-family: 'Karla', sans-serif; 
            padding: 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .form-container {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #e0e0e0;
            transition: all 0.4s ease;
        }

        #auto-input-section {
            margin-top: 10px; 
            padding: 15px; 
            border: 2px dashed #cccccc; 
            background-color: #ffffff; 
            color: #333333; 
            border-radius: 8px;
            transition: all 0.4s ease;
        }

        input, select, textarea {
            margin: 5px;
            padding: 8px;
            background-color: #ffffff;
            color: #333333;
            border: 1px solid #cccccc;
            border-radius: 4px;
            transition: all 0.4s ease;
        }

        #lang-toggle {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #ffffff;
            transition: all 0.4s ease;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px 8px;
            text-align: center;
            min-width: 90px;
            height: 50px;
            transition: all 0.4s ease;
        }

        th {
            background-color: #f5f5f5;
            color: #333333;
        }

       
        .day-label { font-weight: bold; text-align: center; }
        .day-mon { background-color: #fff9c4; color: #000000; }
        .day-tue { background-color: #f8bbd0; color: #000000; }
        .day-wed { background-color: #c8e6c9; color: #000000; }
        .day-thu { background-color: #ffe0b2; color: #000000; }
        .day-fri { background-color: #bbdefb; color: #000000; }
        .day-sat { background-color: #e1bee7; color: #000000; }
        .day-sun { background-color: #ffcdd2; color: #000000; }

        .switch input { display: none; }
        .switch {
            display: inline-block;
            width: 60px;
            height: 34px;
            position: relative;
            cursor: pointer;
        }
        .switch-track {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            border-radius: 34px;
            transition: background-color 0.4s ease;
        }
        .switch-thumb {
            position: absolute;
            height: 26px; width: 26px; left: 4px; bottom: 4px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.4s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        #theme-switch:checked + .switch-track { background-color: #ff9800; }
        #theme-switch:checked + .switch-track .switch-thumb { transform: translateX(26px); }


        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

        body.dark-mode .form-container {
            background-color: #1e1e1e;
            border-color: #333333;
        }

        body.dark-mode #auto-input-section {
            border-color: #555555;
            background-color: #252525;
            color: #ffffff;
        }

        body.dark-mode input, body.dark-mode select, body.dark-mode textarea {
            background-color: #2d2d2d;
            color: #ffffff;
            border-color: #444444;
        }

        body.dark-mode table {
            background-color: #1a1a1a;
        }

        body.dark-mode th {
            background-color: #2d2d2d;
            color: #ffffff;
        }

        body.dark-mode th, body.dark-mode td {
            border: 1px solid #333333;
        }

        body.dark-mode .day-mon { background-color: #fff176; color: #000000; }
        body.dark-mode .day-tue { background-color: #f06292; color: #ffffff; }
        body.dark-mode .day-wed { background-color: #81c784; color: #000000; }
        body.dark-mode .day-thu { background-color: #ffb74d; color: #000000; }
        body.dark-mode .day-fri { background-color: #64b5f6; color: #000000; }
        body.dark-mode .day-sat { background-color: #ba68c8; color: #ffffff; }
        body.dark-mode .day-sun { background-color: #e57373; color: #ffffff; }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>📅 ระบบจัดตารางเรียน</h1>
        <div>
            <button id="lang-toggle">TH | EN</button>
            
            <label class="switch" style="margin-left: 10px;">
                <input type="checkbox" id="theme-switch">
                <span class="switch-track">
                    <span class="switch-thumb">☀️</span>
                </span>
            </label>
        </div>
    </div>

    <hr>

    <div class="form-container">
        <h3>➕ เพิ่มวิชาเรียน / Add Course</h3>
        
        <div style="margin-bottom: 15px;">
            <label><input type="radio" name="add-method" checked> กรอกข้อมูลเอง (Manual)</label>
            <label><input type="radio" name="add-method"> อัปโหลด PDF / วางข้อความ (Auto)</label>
        </div>

        <div id="auto-input-section">
            <p>วิธีที่ 1: ลากไฟล์ PDF ตารางเรียนมาวางที่นี่</p>
            <input type="file" accept=".pdf">
            
            <p style="margin-top: 15px;">วิธีที่ 2: ก๊อปปี้ข้อความตารางเรียนจากเว็บมหาลัยมาวางในกล่องนี้</p>
            <textarea rows="4" placeholder="วางข้อความที่ก๊อปปี้มาที่นี่... (Paste your schedule text here)" style="width: 100%; box-sizing: border-box;"></textarea>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Day/Time</th>
                <th>08:00</th>
                <th>09:00</th>
                <th>10:00</th>
                <th>11:00</th>
                <th>12:00</th>
                <th>13:00</th>
                <th>14:00</th>
                <th>15:00</th>
                <th>16:00</th>
                <th>17:00</th>
                <th>18:00</th>
                <th>19:00</th>
                <th>20:00</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="day-label day-mon">MON</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label day-tue">TUE</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label day-wed">WED</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label day-thu">THU</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label day-fri">FRI</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label day-sat">SAT</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label day-sun">SUN</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
        </tbody>
    </table>

    <script>
        const themeSwitch = document.getElementById('theme-switch');

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            
            const thumb = document.querySelector('.switch-thumb');
            if (themeSwitch.checked) {
                thumb.innerText = "🌙";
            } else {
                thumb.innerText = "☀️";
            }
        }

        themeSwitch.addEventListener('change', toggleTheme);
    </script>
</body>
</html>
