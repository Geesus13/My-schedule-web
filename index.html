<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <title>ระบบจัดตารางเรียน</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Karla, sans-serif;
            padding: 20px;
        }
        .form-container {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input, select, button {
            margin: 5px;
            padding: 8px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }
        button {
            background-color: #ff9800;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #000000;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
            min-width: 80px;
        }
        th {
            background-color: #1f1f1f;
        }
        .day-label {
            font-weight: bold;
            background-color: #1f1f1f;
        }
        #lang-toggle {
            background-color: #4CAF50;
            color: white;
            border: none;
        }
        .switch input {
            display: none;
        }
        
        .switch {
            display: inline-block;
            width: 60px;
            height: 34px;
            position: relative;
            cursor: pointer;
        }
        .switch-track {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            border-radius: 34px;
            transition: background-color 0.4s ease;
        }
        .switch-thumb {
            position: absolute;
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        #theme-switch:checked + .switch-track {
            background-color: #4CAF50;
        }
        
        #theme-switch:checked + .switch-track .switch-thumb {
            transform: translateX(26px);
        }
        body {
            background-color: #ffffff;
            color: #121212;
            font-family: 'Karla', sans-serif;
            padding: 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        body.dark-mode .form-container {
            background-color: #1e1e1e;
        }
    </style>
</head>
<body>

    <h1>📅 ระบบจัดตารางเรียน</h1>
    
<label class="switch">
    <input type="checkbox" id="theme-switch">
    <span class="switch-track">
        <span class="switch-thumb">☀️</span>
    </span>
</label>

    <hr>

<div style="text-align: right;">
    <button id="lang-toggle">TH | EN</button>
</div>

<div class="form-container">
    <h3>➕ เพิ่มวิชาเรียน / Add Course</h3>
    
    <div style="margin-bottom: 15px;">
        <label><input type="radio" name="add-method" checked> กรอกข้อมูลเอง (Manual)</label>
        <label><input type="radio" name="add-method"> อัปโหลด PDF / วางข้อความ (Auto)</label>
    </div>

    <div id="auto-input-section" style="margin-top: 10px; padding: 10px; border: 1px dashed #555;">
        <p>วิธีที่ 1: ลากไฟล์ PDF ตารางเรียนมาวางที่นี่</p>
        <input type="file" accept=".pdf">
        
        <p style="margin-top: 10px;">วิธีที่ 2: ก๊อปปี้ข้อความตารางเรียนจากเว็บมหาลัยมาวางในกล่องนี้</p>
        <textarea rows="4" cols="50" placeholder="วางข้อความที่ก๊อปปี้มาที่นี่... (Paste your schedule text here)" style="background-color: #333; color: white; width: 100%; box-sizing: border-box;"></textarea>
    </div>
</div>

    <table>
        <thead>
            <tr>
                <th>Day/Time</th>
                <th>08:00</th>
                <th>09:00</th>
                <th>10:00</th>
                <th>11:00</th>
                <th>12:00</th>
                <th>13:00</th>
                <th>14:00</th>
                <th>15:00</th>
                <th>16:00</th>
                <th>17:00</th>
                <th>18:00</th>
                <th>19:00</th>
                <th>20:00</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="day-label" style="color: #fff176;">MON</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label" style="color: #f06292;">TUE</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label" style="color: #81c784;">WED</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label" style="color: #ffb74d;">THU</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label" style="color: #64b5f6;">FRI</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label" style="color: #ba68c8;">SAT</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
                <td class="day-label" style="color: #e57373;">SUN</td>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
        </tbody>
    </table>
<script>
    const themeSwitch = document.getElementById('theme-switch');

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        
        const thumb = document.querySelector('.switch-thumb');
        if (themeSwitch.checked) {
            thumb.innerText = "🌙";
        } else {
            thumb.innerText = "☀️";
        }
    }

    themeSwitch.addEventListener('change', toggleTheme);
</script>
</body>
</html>
